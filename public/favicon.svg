<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <style>
      @keyframes float-pulse {
        0%, 100% { transform: translate(48px, 48px) scale(1); filter: drop-shadow(0px 0px 0px rgba(0,0,0,0)); }
        50% { transform: translate(48px, 42px) scale(1.10); filter: drop-shadow(0px 10px 8px rgba(0,0,0,0.6)); }
      }
      .animated {
        animation: float-pulse 2s infinite ease-in-out;
      }
      .front { fill: #ffffff; }
      .side { fill: #cccccc; }
      .back { fill: #999999; }
      .shadow { fill: #000000; }
    </style>
    <!-- Text centered precisely at (0,0)
         Total width: 90 (from -45 to 45)
         Total height: 40 (from -20 to 20)
    -->
    <g id="pjm">
      <!-- P (x from -45 to -20, width 25) -->
      <rect x="-45" y="-20" width="8" height="40"/>
      <rect x="-37" y="-20" width="17" height="8"/>
      <rect x="-28" y="-12" width="8" height="8"/>
      <rect x="-37" y="-4" width="17" height="8"/>

      <!-- J (x from -15 to 5, width 20) -->
      <rect x="-3" y="-20" width="8" height="40"/>
      <rect x="-15" y="12" width="12" height="8"/>

      <!-- M (x from 10 to 45, width 35) -->
      <rect x="10" y="-20" width="8" height="40"/> 
      <rect x="37" y="-20" width="8" height="40"/>
      <rect x="18" y="-20" width="6" height="15"/>
      <rect x="31" y="-20" width="6" height="15"/>
      <rect x="24" y="-12" width="7" height="15"/>
    </g>
  </defs>
  <rect width="100" height="100" fill="transparent" />
  <g class="animated">
    <use href="#pjm" x="4" y="4" class="shadow" />
    <use href="#pjm" x="3" y="3" class="back" />
    <use href="#pjm" x="2" y="2" class="side" />
    <use href="#pjm" x="1" y="1" class="side" />
    <use href="#pjm" x="0" y="0" class="front" />
  </g>
</svg>
